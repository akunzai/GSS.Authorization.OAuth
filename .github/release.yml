---
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot[bot]
      - renovate
  categories:
    - title: ⚡️ Breaking Changes
      labels:
        - breaking
    - title: 🚀 Features
      labels:
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: 🔨 Maintenance
      labels:
        - maintenance
    - title: Misc
      labels:
        - "*"
